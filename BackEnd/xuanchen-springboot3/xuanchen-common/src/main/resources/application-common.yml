spring:
  # 连接池统一使用 Druid（druid-spring-boot-3-starter 自动装配）；
  # url/username/password 等基础项由 dev/prod profile 各自提供
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 初始化连接数与最小/最大空闲、活跃连接
      initial-size: 5
      min-idle: 5
      max-active: 20
      # 获取连接超时时间（毫秒）
      max-wait: 60000
      # 空闲连接检测周期与最小可回收空闲时长（毫秒）
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      # 连接有效性检测：仅 test-while-idle，借出时不做额外校验（性能优先）
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 开启 PSCache（MySQL 5.5+ 建议开启）
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # stat：SQL 执行统计；wall：SQL 注入防火墙
      filters: stat,wall
      filter:
        stat:
          enabled: true
          # 慢 SQL 阈值（毫秒），超过记为 slow sql 并记录日志
          log-slow-sql: true
          slow-sql-millis: 2000
      stat-view-servlet:
        # 内置监控页（/druid/）默认关闭：会暴露 SQL、URI 与数据源统计，
        # 如需开启必须在生产通过 Nginx 白名单/内网限制访问，并配置登录账号：
        # spring.datasource.druid.stat-view-servlet.login-username / login-password
        enabled: false
      web-stat-filter:
        # Web URI 监控，与 stat-view-servlet 一并保持关闭
        enabled: false
  mvc:
    # 找不到 handler 时抛出 NoHandlerFoundException，交给 GlobalExceptionHandler 统一返回 404 JSON
    # （默认该异常不抛，请求会被转发到 /error，浏览器/下载场景拿到 HTML 错误页而非统一 Result）
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # 本服务为纯 API 服务，上传文件访问走 FileManageController 的 /static/** 映射，不依赖默认静态资源；
      # 必须关闭该默认映射，未命中接口的请求才会走到上面的 NoHandlerFoundException（否则被 ResourceHttpRequestHandler 接管）
      add-mappings: false
  servlet:
    multipart:
      # 全局上传大小限制：抬升到 50MB 以支持 AI 知识库大文档（传输层上限）；
      # 各业务自己的大小校验仍然生效（文件中心 max-size、头像等不受影响，只放宽传输上限）
      max-file-size: 50MB
      max-request-size: 60MB
  # 找回密码邮件通道（SMTP）：留空时应用正常启动但邮件无法真正发出，
  # 验证码降级为日志输出（开发联调）。
  # 启用方式：配置 SPRING_MAIL_HOST/USERNAME/PASSWORD 等环境变量（QQ/163 等用授权码作密码，465+SSL）
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${SPRING_MAIL_SSL_ENABLE:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
mybatis-plus:
  mapper-locations: classpath*:com/xuanchen/**/xml/*Mapper.xml
  global-config:
    banner: false
  # 注意：SQL 全量打印（StdOutImpl）只放在 application-dev.yml；
  # common 被 dev/prod 共同 include，这里开启会导致生产环境向控制台泄露全部 SQL 与参数

xuanchen:
  security:
    # 可信反向代理网段（逗号分隔 CIDR）：只有直连对端命中这些网段时，才采信 X-Forwarded-For/X-Real-IP；
    # 留空（生产默认）= 只认 TCP 对端 RemoteAddr，客户端伪造的代理头一律无效。
    # 部署在 Nginx 等反向代理之后时，必须把代理自身地址（如 127.0.0.1/8,10.0.0.0/8）配置进来
    trusted-proxies: ${XUANCHEN_TRUSTED_PROXIES:}
  captcha:
    # 滑块验证码 JWT 签名密钥：生产/多实例环境必须通过环境变量 XUANCHEN_CAPTCHA_SECRET 注入固定值；
    # 留空时每次启动随机生成（重启后旧验证码 token 全部失效，且多实例之间互不通用）。
    # prod profile 下该项为必填（见 application-prod.yml）
    secret: ${XUANCHEN_CAPTCHA_SECRET:}
  jwt:
    # 登录态 JWT 服务端签名密钥（不再使用用户密码哈希）：生产/多实例必须通过环境变量
    # XUANCHEN_JWT_SECRET 注入固定高强度随机串；留空时每次启动随机生成（重启后所有登录态失效）。
    # prod profile 下该项为必填（见 application-prod.yml）
    secret: ${XUANCHEN_JWT_SECRET:}
  crypto:
    # 数据源连接密码的 AES-256-GCM 持久化密钥：多实例必须一致，严禁随机生成
    # （更换/丢失密钥会导致已存数据源密码无法解密）。
    # 本地开发默认值见 application-dev.yml，prod 下为必填（见 application-prod.yml）
    datasource-key: ${XUANCHEN_DATASOURCE_SECRET:}
  generator:
    # 代码生成器输出根目录白名单（逗号分隔，建议绝对路径）。
    # 留空 = 不限制：输出目录由管理员在页面的「选择目录」里挑选，选完即写入该目录（无需任何配置）。
    # 配置后（或配成 "*"）：目录选择器只能在该范围内浏览，写入路径也必须在白名单之下。
    # 生产环境建议显式配置，避免管理员误选系统目录。
    # 说明：zip 打包下载不写用户选择的输出目录；启用白名单时临时目录落在第一个根下的
    # .codegen-tmp/gen-<uuid>（生成完自动删除），因此该根必须对应用进程可写。
    allowed-output-roots: ${XUANCHEN_GEN_OUTPUT_ROOTS:}
    # 默认覆盖已存在文件（dev 场景：点「生成」即更新全部产物）；prod profile 已显式改为 false。
    # 未开启覆盖时若目标目录已有同名文件，生成会直接报错（而非只更新 sql 的假成功）
    allow-file-override: ${XUANCHEN_GEN_ALLOW_OVERRIDE:true}
  mail:
    # 发件人地址（含昵称时形如：萱晨管理系统 <noreply@example.com>）；留空则回退为 spring.mail.username。
    # 生产使用找回密码功能前必须配置 SPRING_MAIL_* 与 XUANCHEN_MAIL_FROM，否则邮件无法真正发出
    from: ${XUANCHEN_MAIL_FROM:}
