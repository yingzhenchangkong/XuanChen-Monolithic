server:
  port: ${SERVER_PORT:8080}
spring:
  profiles:
    # 默认本地开发；生产部署通过环境变量 SPRING_PROFILES_ACTIVE=prod 切换
    active: ${SPRING_PROFILES_ACTIVE:dev}
    include: common
xuanchen:
  path:
    #文件上传根目录
    upload: ${XUANCHEN_UPLOAD_PATH:/xuanchen/upFiles}
  upload:
    #单个上传文件大小上限（org.springframework.util.unit.DataSize 格式）
    max-size: ${XUANCHEN_UPLOAD_MAX_SIZE:5MB}
